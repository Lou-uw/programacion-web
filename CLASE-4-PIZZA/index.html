<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>formularios</title>
    <link rel="stylesheet" href="main.css">
  </head>
  <body>
    <header>
      <h1>Pizzeria ETEC</h1>
      <p>Inicie su pedido online</p>
    </header>
    <main>
      <!--formulario nos sirve para enviar datos-->
      <form>
        <section>
          <h2>Datos de cliente</h2>
          <label for="nombre">Nombre</label>
          <!--el type nos indica lo que podemos ingresar en el input-->
          <input type="text" id="nombre" name="nombre" required />
          <label for="telefono">Telefono</label>
          <input type="tel" id="telefono" name="telefono" />
          <label for="email">Email</label>
          <input type="email" id="email" name="email" />
          <label for="direccion">Direccion</label>
          <input type="text" id="direccion" name="direccion" />
        </section>
        <section>
          <h3>Tamaño:</h3>

          <input type="radio" id="chica" name="tamaño" value="chica" />
          <label for="chica">Chica</label>

          <input type="radio" id="mediana" name="mediana" value="mediana" />
          <label for="mediana">Mediana</label>
          
          <input type="radio" id="grande" name="tamaño" value="grande" />
          <label for="grande">Grande</label>
        </section>
        <section>
          <h2>Cantidad</h2>
          <label for="cantidad">Cantidad</label>
          <input type="number" id="cantidad" name="cantidad" min="1" required>
        </section>
        <section>
          <h2>Ingredientes</h2>

          <input
            type="checkbox"
            id="jamon"
            name="ingrediente_jamon"
            value="jamon"
          />
          <label for="jamon">Jamon</label>
    
          <input
            type="checkbox"
            id="champiñones"
            name="ingrediente_champiñones"
            value="champiñones"
          />
          <label for="champiñones">Champiñon</label>
          
        </section>
        <section>
          <label for="masa">Tipo de masa</label>
          <select id="masa" name="masa">
            <option value="delgada">Delgada</option>
            <option value="gruesa">Gruesa</option>
            <option value="integral">Integral</option>
          </select>
        </section>
        <h2>Comentarios</h2>
        <textarea
          id="comentarios"
          name="comentarios"
          rows="4"
          cols="30"
          required
        ></textarea>

        <!--siempre que haya un formulario vamos a tener un boton type submit-->
        <button type="submit">Enviar pedido</button>
      </form>
      <p id="mensaje"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
